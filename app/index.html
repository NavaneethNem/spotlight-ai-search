<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick AI Search</title>
<style>
  :root { color-scheme: dark; font-family: -apple-system,BlinkMacSystemFont,Inter,"Segoe UI",sans-serif; background:#24272e; color:#f4f5f9; }
  * { box-sizing:border-box; }
  html { overflow:hidden; }
  body { margin:0; }
  main { width:100%; padding:8px; border:1px solid #ffffff24; border-radius:18px; overflow:hidden; background:radial-gradient(ellipse at 0 0,#b9c7e21a,transparent 65%),linear-gradient(145deg,#ffffff0d,#ffffff03 60%); box-shadow:inset 0 1px 0 #ffffff16,inset 0 -1px 0 #00000012; }
  .search { display:flex; align-items:center; gap:14px; padding:4px 10px 4px 13px; height:61px; }
  .magnifier { width:23px; height:23px; flex:none; color:#c4c9d6; }
  input { min-width:0; flex:1; height:46px; background:transparent; border:0; outline:0; font:inherit; font-size:22px; font-weight:400; line-height:1.2; letter-spacing:-.4px; color:inherit; caret-color:#c3d8ff; }
  input::placeholder { color:#d0d4df9c; }
  button { border:1px solid #ffffff18; border-radius:9px; background:linear-gradient(#ffffff12,#ffffff08); width:31px; height:28px; display:grid; place-items:center; color:#c9cdda; cursor:pointer; flex:none; }
  button:hover { background:#ffffff20; color:white; }
  button:focus-visible, li:focus-visible { outline:2px solid #b3caff; outline-offset:2px; }
  button svg { width:16px; height:16px; }
  .divider { height:1px; background:linear-gradient(90deg,transparent,#ffffff14 10%,#ffffff14 90%,transparent); margin:0 10px; }
  footer { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 13px 5px; min-height:31px; color:#b7bdcba6; font-size:10px; line-height:14px; user-select:none; }
  footer .mode { display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .spark { color:#b8d0ff; font-size:12px; }
  .hint { display:flex; align-items:center; gap:6px; }
  kbd { display:inline-flex; align-items:center; justify-content:center; font:inherit; color:#cdd3df; min-width:16px; height:16px; padding:0 3px; border:1px solid #ffffff16; border-radius:4px; background:#ffffff06; }
  ul { list-style:none; padding:5px 0; margin:0 3px 4px; }
  ul[hidden] { display:none; }
  li { height:40px; display:flex; align-items:center; gap:12px; padding:0 13px; border:1px solid transparent; border-radius:9px; font-size:14px; color:#dce0e9; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  li::before { content:'↗'; color:#929bad; font-size:16px; }
  li:hover,li[aria-selected=true] { background:linear-gradient(110deg,#a8c4ff20,#b8caff10); border-color:#c6d8ff17; color:#fff; }
  #status { color:#bdc7dbb0; font-size:10px; padding:2px 14px 7px; }
  #status:empty { display:none; }
  @media(max-width:500px) { input { font-size:19px; } .fresh-label { display:none; } .search { gap:10px; } }
  @media(prefers-reduced-motion:no-preference) { li,button { transition:background .12s,color .12s; } }
</style>
<main>
  <form action="https://www.google.com/search" method="get" autocomplete="off">
    <input type="hidden" name="udm" value="50">
    <input type="hidden" name="aep" value="11">
    <div class="search">
      <svg class="magnifier" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6.8"/><path d="m15.5 15.5 4.8 4.8" stroke-linecap="round"/></svg>
      <input id="query" name="q" placeholder="Search a term or ask anything" aria-label="Search Google AI Mode" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions" spellcheck="false" autofocus required maxlength="2000">
      <button type="submit" aria-label="Ask Google AI Mode" title="Search in AI Mode · Enter"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4v7H5m4-4-4 4 4 4"/></svg></button>
    </div>
    <ul id="suggestions" role="listbox" hidden></ul>
  </form>
  <div class="divider"></div>
  <footer>
    <span class="mode"><span class="spark" aria-hidden="true">✦</span> AI Mode</span>
    <span class="hint"><kbd>↑</kbd><kbd>↓</kbd> choose <kbd>Tab</kbd> complete <span aria-hidden="true">·</span><span class="fresh-label">New</span><kbd>Super</kbd><kbd>Alt</kbd><kbd>Space</kbd></span>
  </footer>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script src="/app.js"></script>
</html>
